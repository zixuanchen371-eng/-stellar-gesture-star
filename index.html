<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#050713" />
  <title>星核 · 手势粒子恒星</title>
  <link rel="stylesheet" href="./style.css" />
  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
      "@mediapipe/tasks-vision": "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14"
    }
  }
  </script>
  <script type="module" src="./main.js"></script>
</head>
<body>
  <main id="app">
    <canvas id="star-canvas" aria-label="交互式粒子恒星"></canvas>

    <header class="brand">
      <div class="brand-mark"></div>
      <div>
        <div class="brand-name">STELLAR / 星核</div>
        <div class="brand-subtitle">GESTURE PARTICLE EXPERIMENT</div>
      </div>
    </header>

    <section class="intro" aria-live="polite">
      <div class="eyebrow">INTERACTIVE UNIVERSE</div>
      <h1 id="state-title">唤醒星核</h1>
      <p id="state-description">张开手掌，让星辰向外扩散。</p>
    </section>

    <aside id="control-panel" class="panel">
      <button id="panel-toggle" class="panel-toggle" type="button"
        aria-expanded="true" aria-controls="panel-content">
        <span>控制中心 / CONTROL</span><span id="panel-chevron">−</span>
      </button>
      <div id="panel-content" class="panel-content">
        <div class="status-row">
          <span class="status-dot" id="status-dot"></span>
          <span id="camera-status">等待摄像头启动</span>
        </div>
        <button id="camera-button" class="primary-button" type="button">启用摄像头</button>
        <div class="divider"></div>
        <div class="control-heading">
          <label for="sensitivity">手势灵敏度</label>
          <output id="sensitivity-value" for="sensitivity">1.0×</output>
        </div>
        <input id="sensitivity" type="range" min="0.2" max="3.0" step="0.1" value="1.0" />
        <div class="range-labels"><span>缓慢</span><span>灵敏</span></div>
        <div class="divider"></div>
        <div class="metric-row"><span>识别手势</span><strong id="gesture-value">等待识别</strong></div>
        <div class="metric-row"><span>张开程度</span><strong id="openness-value">—</strong></div>
        <div class="metric-row"><span>粒子数量</span><strong id="particle-count">—</strong></div>
        <div class="divider"></div>
        <p class="hint">握拳 · 收缩星核<br />张掌 · 扩散星云<br />左右移动 · 引导星核</p>
        <button id="reset-button" class="secondary-button" type="button">重置星核</button>
      </div>
    </aside>

    <div id="notice" class="notice" role="status" aria-live="polite">正在初始化粒子系统……</div>

    <div class="camera-frame" id="camera-frame">
      <video id="camera-video" autoplay muted playsinline width="640" height="480"></video>
      <div class="camera-label"><span class="camera-live-dot"></span>HAND TRACKING</div>
    </div>

    <footer class="footer">
      <span>REAL-TIME PARTICLE SYSTEM</span>
      <span>MOVE YOUR HAND TO CONTROL THE STAR</span>
    </footer>
  </main>
</body>
</html>
